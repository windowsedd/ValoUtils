<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="ValoUtils — settings profiles, career, matches and replays for Valorant">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131A22"/>
      <stop offset="55%" stop-color="#0E1419"/>
      <stop offset="100%" stop-color="#0A0E12"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF4655" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#FF4655" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF4655"/>
      <stop offset="100%" stop-color="#FF4655" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.028" stroke-width="1"/>
    </pattern>
    <clipPath id="frame">
      <!-- Clipped corners: the angular cut Valorant's own UI leans on. -->
      <path d="M28 0 H1200 V292 L1172 320 H0 V28 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>

    <!-- Sweep of angled strokes anchoring the right side, densest at the edge. -->
    <g stroke="#FF4655" stroke-opacity="0.5" stroke-width="2">
      <path d="M980 320 L1120 0" stroke-opacity="0.10"/>
      <path d="M1030 320 L1170 0" stroke-opacity="0.16"/>
      <path d="M1080 320 L1220 0" stroke-opacity="0.26"/>
      <path d="M1130 320 L1270 0" stroke-opacity="0.42"/>
    </g>
    <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1">
      <path d="M900 320 L1040 0"/>
      <path d="M860 320 L1000 0"/>
    </g>
  </g>

  <!-- Accent bar keyed to the wordmark's left edge -->
  <rect x="86" y="96" width="4" height="128" fill="#FF4655"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="118" y="158" font-size="76" font-weight="700" letter-spacing="1" fill="#FFFFFF">
      VALO<tspan fill="#FF4655">UTILS</tspan>
    </text>
    <text x="120" y="200" font-size="21" font-weight="600" letter-spacing="4.5" fill="#8FA3B0">
      SETTINGS · CAREER · MATCHES · REPLAYS
    </text>
    <text x="120" y="248" font-size="16" font-weight="400" letter-spacing="0.2" fill="#5C6B77">
      Unofficial desktop companion for VALORANT — Tauri 2 · React · Rust
    </text>
  </g>

  <rect x="120" y="220" width="330" height="2" fill="url(#rule)"/>
</svg>
