<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0f0f13">
<title>ValoUtils Remote</title>
<style>
:root {
  --bg: #0f0f13; --surface: #17171d; --control: #1f1f27; --hover: #272731;
  --border: #2c2c37; --line: #23232c;
  --text: #ececf1; --text-2: #b4b4c0; --muted: #7c7c8a;
  --accent: #8b5cf6; --accent-text: #ffffff; --accent-soft: rgba(139,92,246,.16);
  --pos: #4ade80; --neg: #f87171; --warn: #fbbf24;
  --bubble-you: #8b5cf6; --bubble-you-text: #fff; --bubble: #1f1f27;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f6f6f8; --surface: #ffffff; --control: #f0f0f4; --hover: #e7e7ee;
    --border: #dcdce4; --line: #ececf1;
    --text: #17171d; --text-2: #3e3e4a; --muted: #73737f;
    --accent: #7c3aed; --accent-soft: rgba(124,58,237,.1);
    --pos: #16a34a; --neg: #dc2626; --warn: #b45309;
    --bubble-you: #7c3aed; --bubble: #ececf1;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex; flex-direction: column; overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
header {
  display: flex; align-items: center; gap: 10px;
  padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
header h1 { font-size: 16px; font-weight: 650; margin: 0; flex: 1; min-width: 0; letter-spacing: -.01em; }
header h1 small { font-weight: 450; color: var(--muted); font-size: 12px; margin-left: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--pos); } .dot.bad { background: var(--neg); }
.icon-btn {
  height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--control); font-size: 13px; font-weight: 550;
}
.icon-btn:active { background: var(--hover); }
nav { display: flex; gap: 4px; padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--line); }
nav button {
  flex: 1; height: 34px; border-radius: 8px; border: 0; background: transparent;
  color: var(--text-2); font-size: 13px; font-weight: 600; position: relative;
}
nav button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
nav button:disabled { opacity: .4; }
.badge {
  display: inline-block; min-width: 16px; height: 16px; padding: 0 4px; margin-left: 4px;
  border-radius: 8px; background: var(--accent); color: var(--accent-text);
  font-size: 10px; line-height: 16px; vertical-align: 1px; font-variant-numeric: tabular-nums;
}
main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.thread { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; overscroll-behavior: contain; }
.msg { max-width: 82%; display: flex; flex-direction: column; align-self: flex-start; }
.msg.you { align-self: flex-end; align-items: flex-end; }
.msg .meta { font-size: 11px; color: var(--muted); margin: 0 4px 2px; }
.msg .bubble {
  background: var(--bubble); padding: 7px 11px; border-radius: 14px; border-top-left-radius: 4px;
  white-space: pre-wrap; overflow-wrap: anywhere;
}
.msg.you .bubble { background: var(--bubble-you); color: var(--bubble-you-text); border-radius: 14px; border-top-right-radius: 4px; }
.msg.cont .meta { display: none; }
.empty { margin: auto; text-align: center; color: var(--muted); padding: 24px; max-width: 320px; font-size: 14px; }
.empty strong { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }
.notice { margin: 8px 16px 0; padding: 8px 12px; border-radius: 8px; font-size: 13px; background: var(--control); color: var(--text-2); }
.notice.bad { color: var(--neg); }
form.composer {
  display: flex; gap: 8px; padding: 10px 12px calc(env(safe-area-inset-bottom) + 10px);
  background: var(--surface); border-top: 1px solid var(--line);
}
.composer input {
  flex: 1; min-width: 0; height: 42px; padding: 0 14px; border-radius: 21px;
  border: 1px solid var(--border); background: var(--control); outline: none; font-size: 16px;
}
.composer input:focus { border-color: var(--accent); }
.composer button, .primary {
  height: 42px; padding: 0 18px; border-radius: 21px; border: 0;
  background: var(--accent); color: var(--accent-text); font-weight: 650;
}
.composer button:disabled, .primary:disabled, .composer input:disabled { opacity: .45; }
.list { flex: 1; overflow-y: auto; }
.friend {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 16px;
  border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left;
}
.friend:active { background: var(--hover); }
.friend .who { flex: 1; min-width: 0; }
.friend .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.friend .last { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.search { margin: 10px 16px; }
.search input { width: 100%; height: 38px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--control); outline: none; font-size: 16px; }
.back { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--surface); }
.back strong { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Party sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; z-index: 10; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; max-height: 88%; overflow-y: auto; z-index: 11;
  background: var(--surface); border-top-left-radius: 16px; border-top-right-radius: 16px;
  padding: 8px 16px calc(env(safe-area-inset-bottom) + 16px); transform: translateY(100%);
  transition: transform .22s cubic-bezier(.2,.8,.2,1);
}
.open .sheet-bg { display: block; } .open .sheet { transform: none; }
.grab { width: 36px; height: 4px; border-radius: 2px; background: var(--border); margin: 0 auto 12px; }
.sheet h2 { font-size: 15px; margin: 0 0 4px; }
.sub { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
.members { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.member { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; background: var(--control); font-size: 14px; }
.member .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.member .r { color: var(--muted); font-size: 12px; }
.tag { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
.row { display: flex; gap: 8px; margin-bottom: 10px; }
.row > * { flex: 1; min-width: 0; }
.row select, .row input { height: 42px; border-radius: 10px; border: 1px solid var(--border); background: var(--control); padding: 0 10px; font-size: 16px; }
.secondary { height: 42px; border-radius: 10px; border: 1px solid var(--border); background: var(--control); font-weight: 600; }
.secondary:disabled { opacity: .45; }
.danger { color: var(--neg); }
.code-box { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); margin-bottom: 10px; }
.code-box b { flex: 1; font-size: 20px; letter-spacing: .12em; font-variant-numeric: tabular-nums; }
.section-label { font-size: 12px; font-weight: 600; color: var(--muted); margin: 14px 0 6px; }
.toast {
  position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 76px); z-index: 20;
  padding: 10px 14px; border-radius: 10px; background: var(--text); color: var(--bg); font-size: 14px;
  opacity: 0; transform: translateY(8px); transition: opacity .18s, transform .18s; pointer-events: none;
}
.toast.show { opacity: 1; transform: none; }
.toast.bad { background: var(--neg); color: #fff; }
/* Sidebar: a drawer on phones, a fixed column from 760px. */
.layout { flex: 1; min-height: 0; display: flex; }
.content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
aside {
  position: fixed; top: 0; bottom: 0; left: 0; z-index: 12; width: min(300px, 84vw);
  display: flex; flex-direction: column; background: var(--surface); border-right: 1px solid var(--line);
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  transform: translateX(-100%); transition: transform .22s cubic-bezier(.2,.8,.2,1); visibility: hidden;
}
body.drawer aside { transform: none; visibility: visible; }
.drawer-bg { display: none; position: fixed; inset: 0; z-index: 11; background: rgba(0,0,0,.5); }
body.drawer .drawer-bg { display: block; }
.side-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 6px; }
.side-head strong { flex: 1; font-size: 15px; }
.side-list { flex: 1; overflow-y: auto; padding: 0 8px 8px; overscroll-behavior: contain; }
.side-label { font-size: 11px; font-weight: 650; color: var(--muted); padding: 14px 8px 6px; letter-spacing: .02em; }
.side-item {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; border: 0; border-radius: 8px;
  background: transparent; text-align: left; min-height: 48px;
}
.side-item:hover { background: var(--hover); }
.side-item[aria-current="true"] { background: var(--accent-soft); }
.side-item[aria-current="true"] .side-name { color: var(--accent); }
.side-item .who { flex: 1; min-width: 0; }
.side-name { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-prev { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-item.off { opacity: .5; }
.room-icon {
  width: 32px; height: 32px; border-radius: 8px; flex: none; display: grid; place-items: center;
  background: var(--control); color: var(--text-2); font-size: 12px; font-weight: 700;
}
.side-item[aria-current="true"] .room-icon { background: var(--accent); color: var(--accent-text); }
.side-foot { border-top: 1px solid var(--line); padding: 10px 12px; }
.side-foot button { width: 100%; }
#menuBtn { padding: 0 10px; display: grid; place-items: center; }
@media (min-width: 760px) {
  aside { position: static; transform: none; visibility: visible; width: 280px; padding: 0; z-index: auto; transition: none; }
  .drawer-bg, body.drawer .drawer-bg { display: none; }
  #menuBtn, nav, #sideClose { display: none; }
}
</style>
</head>
<body>
<header>
  <button class="icon-btn" id="menuBtn" type="button" aria-label="Chats" aria-controls="side" aria-expanded="false">
    <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <span class="dot" id="dot" aria-hidden="true"></span>
  <h1>ValoUtils<small id="sub">Remote chat</small></h1>
  <button class="icon-btn" id="partyBtn" type="button">Party</button>
</header>
<div class="layout">
  <div class="drawer-bg" id="drawerBg"></div>
  <aside id="side" aria-label="Chats">
    <div class="side-head">
      <strong>Chats</strong>
      <button class="icon-btn" id="sideClose" type="button" aria-label="Close">✕</button>
    </div>
    <div class="side-list" id="sideList"></div>
    <div class="side-foot"><button class="secondary" id="sideParty" type="button">Party &amp; queue</button></div>
  </aside>
  <div class="content">
    <nav id="tabs" role="tablist">
      <button role="tab" data-tab="party" aria-selected="true">Party</button>
      <button role="tab" data-tab="team">Team</button>
      <button role="tab" data-tab="all">All</button>
      <button role="tab" data-tab="friends">Friends</button>
    </nav>
    <main id="main"></main>
  </div>
</div>
<div id="sheetWrap">
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet" id="sheet" role="dialog" aria-label="Party"></div>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
"use strict";
const KEY = "valoutils-remote-token";
const store = {
  get() { try { return localStorage.getItem(KEY) || ""; } catch { return ""; } },
  set(v) { try { localStorage.setItem(KEY, v); } catch {} },
  clear() { try { localStorage.removeItem(KEY); } catch {} },
};
// The token arrives in the URL fragment from the QR code; keep it and drop it from the address bar.
(function takeToken() {
  const m = /[#&]t=([A-Za-z0-9_-]+)/.exec(location.hash);
  if (m) { store.set(m[1]); history.replaceState(null, "", location.pathname); }
})();
let token = store.get();

const state = { tab: "party", friend: null, history: {}, chat: null, party: null, partyError: "", error: "", code: null, search: "", drafts: {}, seen: {} };
const $ = (id) => document.getElementById(id);
function el(tag, props, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else if (k in node && typeof v !== "string") node[k] = v;
    else node.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) node.append(kid.nodeType ? kid : String(kid));
  return node;
}
let toastTimer;
function toast(text, bad) {
  const t = $("toast"); t.textContent = text; t.className = "toast show" + (bad ? " bad" : "");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.className = "toast" + (bad ? " bad" : ""); }, 2600);
}

async function api(path, body) {
  const res = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: Object.assign({ Authorization: "Bearer " + token }, body ? { "Content-Type": "application/json" } : {}),
    body: body ? JSON.stringify(body) : undefined,
    cache: "no-store",
  });
  if (res.status === 401) { store.clear(); token = ""; render(); throw new Error("unpaired"); }
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

function ms(t) {
  if (t == null) return 0;
  if (typeof t === "number") return t;
  return /^\d+$/.test(t) ? Number(t) : (Date.parse(t) || 0);
}
function clock(t) {
  const d = new Date(ms(t)); if (!ms(t)) return "";
  const time = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  // Whisper history reaches back days; older lines carry their date.
  return d.toDateString() === new Date().toDateString()
    ? time
    : d.toLocaleDateString([], { month: "short", day: "numeric" }) + " " + time;
}

// ---- polling
let chatTimer, partyTimer, online = null;
async function pollChat() {
  clearTimeout(chatTimer);
  if (!token) return;
  try {
    const reply = await api("/api/state");
    online = true;
    if (reply.success) {
      state.chat = reply; state.error = "";
      if (state.tab === "friends" && state.friend && (++whisperTick % 2 === 0)) {
        const f = (reply.friends || []).find((x) => x.puuid === state.friend);
        loadWhisper(state.friend, (f?.unread || 0) > 0);
      }
      for (const [tab, room] of Object.entries(reply.rooms || {})) if (room && state.seen[tab] === undefined) markSeen(tab, room.messages);
    }
    else { state.error = reply.code === "loginRequired" ? "Riot Client isn't signed in on the PC." : (reply.error || "Chat isn't available right now."); }
  } catch (e) { if (e.message !== "unpaired") { online = false; state.error = "Can't reach ValoUtils. Is the PC on and the app open?"; } }
  render();
  chatTimer = setTimeout(pollChat, document.hidden ? 15000 : 3000);
}
async function pollParty() {
  clearTimeout(partyTimer);
  if (!token) return;
  try {
    const reply = await api("/api/party");
    if (reply.success) { state.party = reply.party; state.partyError = ""; }
    else { state.party = null; state.partyError = reply.error || "No party right now."; }
  } catch {}
  renderSheet(); renderHeader();
  partyTimer = setTimeout(pollParty, document.hidden ? 30000 : (sheetOpen() ? 4000 : 10000));
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) { pollChat(); pollParty(); } });

// ---- rendering
function renderHeader() {
  $("dot").className = "dot" + (online === true && !state.error ? " ok" : online === false || state.error ? " bad" : "");
  const p = state.party;
  $("sub").textContent = p ? (p.searching ? "Searching · " + (p.queue || "") : (p.members?.length || 1) + " in party") : "Remote chat";
  const rooms = state.chat?.rooms || {};
  for (const b of $("tabs").querySelectorAll("button")) {
    const tab = b.dataset.tab;
    b.setAttribute("aria-selected", String(tab === state.tab));
    const label = tab[0].toUpperCase() + tab.slice(1);
    b.textContent = label;
    if (tab === "friends") {
      const unread = (state.chat?.friends || []).reduce((n, f) => n + friendUnread(f), 0);
      if (unread) b.append(el("span", { class: "badge" }, unread > 99 ? "99+" : unread));
    } else if (state.chat && !rooms[tab]) {
      b.style.opacity = ".5";
      continue;
    } else {
      const unread = roomUnread(tab);
      if (unread) b.append(el("span", { class: "badge" }, unread));
    }
    b.style.opacity = "";
  }
  renderSidebar();
}

/* Unread = other people's lines newer than the last line seen in that chat.
   By time, not count: the server sends only the last 100 room lines (50 per
   whisper), so counts stop moving in a busy room. */
const lastTime = (messages) => messages?.length ? ms(messages[messages.length - 1].time) : 0;
function markSeen(key, messages) { state.seen[key] = Math.max(state.seen[key] || 0, lastTime(messages)); }
function unreadSince(key, messages, fallback) {
  const seen = state.seen[key];
  if (seen === undefined) return fallback;
  return (messages || []).filter((m) => !m.you && ms(m.time) > seen).length;
}
/** New lines in a room since it was last open (history from before the page loaded counts as read). */
function roomUnread(tab) {
  if (tab === state.tab) return 0;
  return unreadSince(tab, state.chat?.rooms?.[tab]?.messages, 0);
}
/** Riot's unread count until the whisper is opened here, then lines since. */
function friendUnread(f) {
  if (state.tab === "friends" && state.friend === f.puuid) return 0;
  return unreadSince("dm:" + f.puuid, f.messages, f.unread || 0);
}

function preview(messages) {
  const m = messages?.[messages.length - 1];
  return m ? (m.you ? "You: " : (m.from ? m.from.split("#")[0] + ": " : "")) + (m.text || "") : "";
}

// ---- sidebar
const ROOMS = [
  ["party", "Party", "P", "Open VALORANT on the PC"],
  ["team", "Team", "T", "During agent select or a match"],
  ["all", "All", "A", "During a match"],
];
let whisperTick = 0;
/** Full whisper history (the summary carries only recent lines); `read` also marks it read in Riot. */
async function loadWhisper(puuid, read) {
  try {
    const reply = await api("/api/whisper", { puuid, read: !!read });
    if (!reply.success) return;
    state.history[puuid] = reply.messages || [];
    if (state.tab === "friends" && state.friend === puuid) render();
  } catch {}
}
/** History plus the summary's newest lines, without duplicates, oldest first. */
function dmMessages(f) {
  const seen = new Set();
  const out = [];
  for (const m of [...(state.history[f.puuid] || []), ...(f.messages || [])]) {
    const key = m.id || ms(m.time) + "|" + m.text;
    if (seen.has(key)) continue;
    seen.add(key);
    out.push(m);
  }
  return out.sort((a, b) => ms(a.time) - ms(b.time));
}
function select(tab, friend) {
  if (friend && friend !== state.friend) loadWhisper(friend, true);
  state.tab = tab; state.friend = friend || null;
  openDrawer(false);
  render();
}
function renderSidebar() {
  const list = $("sideList");
  const top = list.scrollTop;
  const rooms = state.chat?.rooms || {};
  const items = [el("div", { class: "side-label" }, "ROOMS")];
  for (const [tab, name, icon, hint] of ROOMS) {
    const room = rooms[tab];
    const unread = roomUnread(tab);
    items.push(el("button", {
      class: "side-item" + (room ? "" : " off"), type: "button",
      "aria-current": String(state.tab === tab), onclick: () => select(tab),
    },
      el("span", { class: "room-icon", "aria-hidden": "true" }, icon),
      el("span", { class: "who" },
        el("div", { class: "side-name" }, name + (room?.ended ? " · ended" : "")),
        el("div", { class: "side-prev" }, room ? (preview(room.messages) || "No messages yet") : hint)),
      unread ? el("span", { class: "badge" }, unread) : null));
  }
  const last = (f) => f.messages?.length ? ms(f.messages[f.messages.length - 1].time) : 0;
  const friends = (state.chat?.friends || [])
    .filter((f) => f.online || friendUnread(f) || f.messages?.length)
    .sort((a, b) => (friendUnread(b) - friendUnread(a)) || (last(b) - last(a)) || (b.online - a.online) || String(a.name).localeCompare(String(b.name)));
  const onlineCount = (state.chat?.friends || []).filter((f) => f.online).length;
  items.push(el("div", { class: "side-label" }, "FRIENDS · " + onlineCount + " ONLINE"));
  if (!friends.length) items.push(el("div", { class: "side-prev", style: "padding: 4px 8px" }, state.chat ? "No friends online." : "Loading…"));
  for (const f of friends) {
    items.push(el("button", {
      class: "side-item", type: "button",
      "aria-current": String(state.tab === "friends" && state.friend === f.puuid),
      onclick: () => select("friends", f.puuid),
    },
      el("span", { class: "dot" + (f.online ? " ok" : "") }),
      el("span", { class: "who" },
        el("div", { class: "side-name" }, f.name || "Friend"),
        el("div", { class: "side-prev" }, preview(f.messages) || (f.online ? "Online" : "Offline"))),
      friendUnread(f) ? el("span", { class: "badge" }, friendUnread(f)) : null));
  }
  items.push(el("button", { class: "side-item", type: "button", onclick: () => select("friends") },
    el("span", { class: "room-icon", "aria-hidden": "true" }, "…"),
    el("span", { class: "who" }, el("div", { class: "side-name" }, "All friends"))));
  list.replaceChildren(...items);
  list.scrollTop = top;
}
function openDrawer(open) {
  document.body.classList.toggle("drawer", open);
  $("menuBtn").setAttribute("aria-expanded", String(open));
}
$("menuBtn").onclick = () => openDrawer(!document.body.classList.contains("drawer"));
$("drawerBg").onclick = () => openDrawer(false);
$("sideClose").onclick = () => openDrawer(false);
$("sideParty").onclick = () => { openDrawer(false); openSheet(true); };
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { openDrawer(false); openSheet(false); } });

let lastThreadKey = "";
function thread(messages) {
  const box = el("div", { class: "thread", id: "thread" });
  if (!messages.length) box.append(el("div", { class: "empty" }, el("strong", {}, "No messages yet"), "Say something."));
  let prev = null;
  for (const m of messages) {
    const cont = prev && prev.from === m.from && prev.you === m.you && ms(m.time) - ms(prev.time) < 120000;
    box.append(el("div", { class: "msg" + (m.you ? " you" : "") + (cont ? " cont" : "") },
      el("div", { class: "meta" }, (m.you ? "You" : (m.from || "?")) + (clock(m.time) ? " · " + clock(m.time) : "")),
      el("div", { class: "bubble" }, m.text || "")));
    prev = m;
  }
  return box;
}

function composer(target, disabledReason) {
  const input = el("input", {
    id: "draft", placeholder: disabledReason || "Message", maxlength: 1000, autocomplete: "off",
    enterkeyhint: "send", disabled: !!disabledReason, value: state.drafts[target.key] || "",
    oninput: (e) => { state.drafts[target.key] = e.target.value; },
  });
  const btn = el("button", { type: "submit", disabled: !!disabledReason }, "Send");
  return el("form", {
    class: "composer",
    onsubmit: async (e) => {
      e.preventDefault();
      const text = input.value.trim(); if (!text) return;
      btn.disabled = true;
      try {
        const reply = await api("/api/send", Object.assign({ message: text }, target.body));
        if (reply.success) {
          state.drafts[target.key] = ""; input.value = ""; pollChat();
          if (target.body.channel === "friend") loadWhisper(target.body.puuid, false);
        }
        else toast(reply.error || "Not sent.", true);
      } catch (err) { if (err.message !== "unpaired") toast("Not sent: can't reach ValoUtils.", true); }
      finally { btn.disabled = false; input.focus(); }
    },
  }, input, btn);
}

// What the screen is made of, apart from message contents. While it stays the
// same a poll only swaps the message list, so the text box keeps focus and the
// phone keyboard stays open.
function viewSig() {
  if (!token) return "unpaired";
  if (!state.chat) return "loading|" + state.error;
  if (state.tab === "friends") return "friends|" + (state.friend || "") + "|" + state.error;
  const room = state.chat.rooms?.[state.tab];
  return [state.tab, room ? "room" : "none", room?.ended ? "ended" : "", state.error].join("|");
}
let lastSig = "";

function render() {
  renderHeader();
  const main = $("main");
  const old = $("thread");
  const nearBottom = !old || old.scrollHeight - old.scrollTop - old.clientHeight < 80;
  const prevTop = old ? old.scrollTop : 0;
  const sig = viewSig();
  if (sig === lastSig && patch(old, nearBottom, prevTop)) return;
  lastSig = sig;
  main.replaceChildren();

  if (!token) {
    main.append(el("div", { class: "empty" }, el("strong", {}, "Not paired"),
      "Open ValoUtils on your PC → Settings → Remote chat, and scan the QR code with this phone."));
    return;
  }
  if (state.error) main.append(el("div", { class: "notice bad" }, state.error));
  if (!state.chat) { main.append(el("div", { class: "empty" }, "Loading…")); return; }

  let key = state.tab;
  if (state.tab === "friends" && !state.friend) {
    renderFriends(main);
  } else if (state.tab === "friends") {
    const f = (state.chat.friends || []).find((x) => x.puuid === state.friend);
    if (!f) { state.friend = null; return render(); }
    key = "dm:" + f.puuid;
    markSeen(key, f.messages);
    main.append(el("div", { class: "back" },
      el("button", { class: "icon-btn", type: "button", onclick: () => { state.friend = null; render(); } }, "‹ Back"),
      el("span", { class: "dot" + (f.online ? " ok" : "") }),
      el("strong", {}, f.name || "Friend")));
    main.append(thread(dmMessages(f), key));
    main.append(composer({ key, body: { channel: "friend", puuid: f.puuid } }));
  } else {
    const room = state.chat.rooms?.[state.tab];
    const names = { party: "party", team: "team", all: "all" };
    if (!room) {
      main.append(el("div", { class: "empty" }, el("strong", {}, "No " + names[state.tab] + " chat"),
        state.tab === "party" ? "Open VALORANT on the PC to join party chat." : "This room exists during agent select or a match."));
    } else {
      markSeen(state.tab, room.messages);
      main.append(thread(room.messages, key));
      main.append(composer({ key, body: { channel: state.tab } }, room.ended ? "Match ended — read only" : ""));
    }
  }
  const box = $("thread");
  if (box) box.scrollTop = key !== lastThreadKey || nearBottom ? box.scrollHeight : prevTop;
  lastThreadKey = key;
}

/** Same view as before: refresh only the messages or the friend rows. */
function patch(old, nearBottom, prevTop) {
  if (!state.chat || !token) return true;
  if (state.tab === "friends" && !state.friend) {
    const list = $("friendList"); if (!list) return false;
    list.replaceChildren(...friendRows().childNodes);
    return true;
  }
  if (!old) return state.tab !== "friends" && !state.chat.rooms?.[state.tab];
  let messages;
  if (state.tab === "friends") {
    const f = (state.chat.friends || []).find((x) => x.puuid === state.friend);
    if (!f) return false;
    messages = dmMessages(f);
    markSeen("dm:" + f.puuid, messages);
  } else {
    const room = state.chat.rooms?.[state.tab];
    markSeen(state.tab, room.messages);
    messages = room.messages;
  }
  old.replaceChildren(...thread(messages).childNodes);
  old.scrollTop = nearBottom ? old.scrollHeight : prevTop;
  return true;
}

function renderFriends(main) {
  main.append(el("div", { class: "search" }, el("input", {
    id: "search", type: "search", placeholder: "Search friends", value: state.search,
    oninput: (e) => { state.search = e.target.value; render(); },
  })));
  main.append(friendRows());
}

function friendRows() {
  const q = state.search.trim().toLowerCase();
  const last = (f) => f.messages?.length ? ms(f.messages[f.messages.length - 1].time) : 0;
  const list = (state.chat.friends || [])
    .filter((f) => !q || (f.name || "").toLowerCase().includes(q))
    .sort((a, b) => (friendUnread(b) - friendUnread(a)) || (last(b) - last(a)) || (b.online - a.online) || String(a.name).localeCompare(String(b.name)));
  const box = el("div", { class: "list", id: "friendList" });
  if (!list.length) box.append(el("div", { class: "empty" }, q ? "No friends match." : "No friends to show."));
  for (const f of list) {
    const lm = f.messages?.[f.messages.length - 1];
    box.append(el("button", { class: "friend", type: "button", onclick: () => select("friends", f.puuid) },
      el("span", { class: "dot" + (f.online ? " ok" : "") }),
      el("span", { class: "who" },
        el("div", { class: "name" }, f.name || "Friend"),
        el("div", { class: "last" }, lm ? (lm.you ? "You: " : "") + (lm.text || "") : (f.online ? "Online" : "Offline"))),
      friendUnread(f) ? el("span", { class: "badge" }, friendUnread(f)) : null));
  }
  return box;
}

// ---- party sheet
const sheetOpen = () => document.body.classList.contains("open");
function openSheet(open) { document.body.classList.toggle("open", open); if (open) { renderSheet(); pollParty(); } }
$("partyBtn").onclick = () => openSheet(!sheetOpen());
$("sheetBg").onclick = () => openSheet(false);

async function partyAction(action, extra, button) {
  if (button) button.disabled = true;
  try {
    const reply = await api("/api/party", Object.assign({ action }, extra || {}));
    if (!reply.success) { toast(reply.error || "That didn't work.", true); return; }
    if (reply.inviteCode) state.code = reply.inviteCode;
    if (action === "disable_code") state.code = null;
    toast(reply.inviteCode ? "Party code " + reply.inviteCode : (reply.message || "Done."));
    pollParty(); pollChat();
  } catch (e) { if (e.message !== "unpaired") toast("Can't reach ValoUtils.", true); }
  finally { if (button) button.disabled = false; }
}

function renderSheet() {
  const sheet = $("sheet");
  // Don't rebuild under a typing thumb; the next poll catches up.
  if (!sheetOpen() || document.activeElement?.id === "joinCode") return;
  const p = state.party;
  const keepJoin = $("joinCode")?.value || "";
  sheet.replaceChildren(el("div", { class: "grab" }));
  if (!p) {
    sheet.append(el("h2", {}, "Party"), el("p", { class: "sub" }, state.partyError || "Loading…"));
  } else {
    sheet.append(el("h2", {}, p.searching ? "Searching for a match" : "Party"),
      el("p", { class: "sub" }, [p.queue, p.accessibility === "OPEN" ? "Open party" : "Closed party"].filter(Boolean).join(" · ")));
    sheet.append(el("div", { class: "members" }, (p.members || []).map((m) => el("div", { class: "member" },
      el("span", { class: "n" }, m.riotId || "Player"),
      m.isYou ? el("span", { class: "tag" }, "YOU") : null,
      m.isOwner ? el("span", { class: "tag" }, "LEADER") : null,
      el("span", { class: "r" }, m.rank || "")))));
    const queues = Array.isArray(p.eligibleQueues) ? p.eligibleQueues : [];
    const select = el("select", { "aria-label": "Queue", disabled: p.searching || !queues.length,
      onchange: (e) => partyAction("change_queue", { queue: e.target.value }) },
      (queues.length ? queues : [p.queue || ""]).map((q) => el("option", { value: q, selected: String(q).toLowerCase() === String(p.queue || "").toLowerCase() }, q)));
    const queueBtn = el("button", { class: "primary", type: "button",
      onclick: (e) => partyAction(p.searching ? "stop_queue" : "start_queue", null, e.currentTarget) },
      p.searching ? "Stop queue" : "Start queue");
    sheet.append(el("div", { class: "row" }, select, queueBtn));
  }
  sheet.append(el("div", { class: "section-label" }, "Party code"));
  if (state.code) {
    sheet.append(el("div", { class: "code-box" }, el("b", {}, state.code),
      el("button", { class: "icon-btn", type: "button", onclick: () => {
        navigator.clipboard?.writeText(state.code).then(() => toast("Copied."), () => toast("Copy isn't available here.", true));
      } }, "Copy")));
  }
  sheet.append(el("div", { class: "row" },
    el("button", { class: "secondary", type: "button", onclick: (e) => partyAction("create_code", null, e.currentTarget) }, state.code ? "New code" : "Create code"),
    el("button", { class: "secondary", type: "button", onclick: (e) => partyAction("disable_code", null, e.currentTarget) }, "Turn off code")));
  const join = el("input", { id: "joinCode", placeholder: "Code or party link", autocomplete: "off", autocapitalize: "characters", value: keepJoin });
  sheet.append(el("div", { class: "row" }, join,
    el("button", { class: "secondary", type: "button", onclick: (e) => {
      const code = join.value.trim(); if (!code) return toast("Enter a party code.", true);
      partyAction("join_code", { code }, e.currentTarget);
    } }, "Join")));
  if (p) {
    sheet.append(el("div", { class: "row" }, el("button", { class: "secondary danger", type: "button", onclick: (e) => {
      if (confirm("Leave the party?")) partyAction("leave_party", null, e.currentTarget);
    } }, "Leave party")));
  }
}

$("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-tab]"); if (!b) return;
  if (state.tab === b.dataset.tab && b.dataset.tab === "friends") state.friend = null;
  state.tab = b.dataset.tab; render();
});

render();
pollChat();
pollParty();
</script>
</body>
</html>
