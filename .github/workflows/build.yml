name: Build & Release

# Two ways in:
# - Push a v* tag yourself (bun run version X.Y.Z, then push --follow-tags).
# - Push to master with a version bump: the tag job sees that package.json's
#   version has no v<version> tag yet, creates and pushes it, and the build job
#   releases it in this same run. (A tag pushed with GITHUB_TOKEN does not start
#   another workflow run, so the build has to happen here.)
on:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto release tag
        id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(jq -r .version package.json)
          tag="v$version"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to release."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "ValoUtils $tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          echo "::notice::Created release tag $tag at $GITHUB_SHA"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    if: needs.tag.outputs.tag != ''
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install

      - name: Verify release version
        shell: pwsh
        run: |
          $releaseVersion = '${{ needs.tag.outputs.tag }}'.Substring(1)
          bun run version:check $releaseVersion

      # Without a signing key tauri builds the installer unsigned, tauri-action
      # skips latest.json with only a log warning, and the release looks fine
      # while the in-app updater 404s on latest.json ("Could not fetch a valid
      # release JSON from the remote"). Fail here, before the release exists.
      - name: Verify signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            Write-Host "::error::TAURI_SIGNING_PRIVATE_KEY is empty or unset. Add the contents of src-tauri/valoutils.key under Settings > Secrets and variables > Actions (plus TAURI_SIGNING_PRIVATE_KEY_PASSWORD if the key has a password). Without it the release ships unsigned and the auto-updater cannot read it."
            exit 1
          }

      # On a version tag → build, sign, and publish a GitHub Release.
      - name: Build & Publish
        id: publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.tag.outputs.tag }}
          releaseName: 'ValoUtils ${{ needs.tag.outputs.tag }}'
          releaseDraft: true
          prerelease: false

      # The updater endpoint reads latest.json, and latest.json references the
      # installer's .sig. A release missing either is dead on arrival, so assert
      # both were uploaded rather than discovering it from a user bug report.
      - name: Verify updater assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releaseId = '${{ steps.publish.outputs.releaseId }}'
          if ([string]::IsNullOrWhiteSpace($releaseId)) {
            Write-Host "::error::tauri-action did not report a releaseId, so the release assets cannot be verified."
            exit 1
          }
          # @() keeps this an array even when the release has a single asset,
          # so -contains and Where-Object below behave.
          $assets = @(gh api "repos/${{ github.repository }}/releases/$releaseId/assets" --paginate --jq '.[].name')
          Write-Host ("Release assets:`n" + ($assets -join "`n"))
          $missing = @()
          if ($assets -notcontains 'latest.json') { $missing += 'latest.json' }
          if (-not ($assets | Where-Object { $_ -like '*-setup.exe.sig' })) { $missing += '*-setup.exe.sig' }
          if ($missing.Count -gt 0) {
            Write-Host "::error::The release is missing $($missing -join ', '). The auto-updater will fail with 'Could not fetch a valid release JSON from the remote'. Check that the signing secrets are correct, delete the draft release and the tag, then retag."
            exit 1
          }

      # releaseDraft keeps the release invisible until published by hand, and the
      # updater endpoint (releases/latest/download/latest.json) 404s for as long
      # as it stays a draft. Say so in the log so the release is not left half-cut.
      - name: Publishing reminder
        shell: pwsh
        run: |
          Write-Host "::notice::Draft release ${{ needs.tag.outputs.tag }} is ready at ${{ steps.publish.outputs.releaseHtmlUrl }} — publish it in the GitHub UI, or the auto-updater stays broken."
