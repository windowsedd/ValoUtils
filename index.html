<!DOCTYPE html>
<html lang="en" class="dark" style="background:#0f0f11">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/png" href="/icon.png"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ValoUtils</title>
    <!-- Inline so the launch splash paints before any script or stylesheet loads.
         src/main.tsx fades it out once the app has rendered. -->
    <style>
        #splash {
            position: fixed;
            inset: 0;
            z-index: 2147483647;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            background: #0f0f11;
            transition: opacity 320ms ease, visibility 0s linear 320ms;
        }
        #splash.splash-hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        #splash .splash-mark {
            position: relative;
            display: grid;
            place-items: center;
            width: 88px;
            height: 88px;
        }
        #splash .splash-glow {
            position: absolute;
            inset: -28px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(128, 100, 233, 0.45), rgba(128, 100, 233, 0) 65%);
            opacity: 0;
            animation: splash-glow 1.6s ease-in-out 200ms infinite;
        }
        #splash img {
            position: relative;
            width: 72px;
            height: 72px;
            object-fit: contain;
            opacity: 0;
            animation: splash-in 560ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        #splash .splash-name {
            font: 600 15px/1 system-ui, "Segoe UI", sans-serif;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: #e8e6ef;
            opacity: 0;
            animation: splash-name 620ms cubic-bezier(0.2, 0.8, 0.2, 1) 160ms forwards;
        }
        #splash .splash-bar {
            position: relative;
            width: 120px;
            height: 2px;
            overflow: hidden;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.08);
            opacity: 0;
            animation: splash-fade 400ms ease 320ms forwards;
        }
        #splash .splash-bar::after {
            content: "";
            position: absolute;
            inset: 0;
            width: 40%;
            border-radius: inherit;
            background: #8064e9;
            animation: splash-bar 1.1s ease-in-out infinite;
        }
        @keyframes splash-in {
            from { opacity: 0; transform: scale(0.82) translateY(6px); }
            to { opacity: 1; transform: none; }
        }
        @keyframes splash-name {
            from { opacity: 0; letter-spacing: 0.6em; }
            to { opacity: 1; letter-spacing: 0.32em; }
        }
        @keyframes splash-fade {
            to { opacity: 1; }
        }
        @keyframes splash-glow {
            0%, 100% { opacity: 0.35; transform: scale(0.92); }
            50% { opacity: 0.8; transform: scale(1.04); }
        }
        @keyframes splash-bar {
            from { transform: translateX(-100%); }
            to { transform: translateX(250%); }
        }
        @media (prefers-reduced-motion: reduce) {
            #splash, #splash * { animation: none !important; transition: none !important; }
            #splash img, #splash .splash-name, #splash .splash-bar { opacity: 1; }
            #splash .splash-glow { opacity: 0.5; }
        }
    </style>
</head>
<body>
<div id="splash" aria-hidden="true">
    <div class="splash-mark">
        <div class="splash-glow"></div>
        <img src="/icon.png" alt=""/>
    </div>
    <div class="splash-name">ValoUtils</div>
    <div class="splash-bar"></div>
</div>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
